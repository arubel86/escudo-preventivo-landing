<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Dispositivos Multi-Pantalla | Aizprua S.E. /visor</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#3849C8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Marco de titanio con bisel de alta gama para iPhone */
    .frame-iphone {
      border: 12px solid #1e293b;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8), 
                  0 0 0 2px rgba(255, 255, 255, 0.12),
                  inset 0 0 0 1px rgba(0, 0, 0, 0.9);
      border-radius: 54px;
    }
    
    /* Marco Samsung Ultra */
    .frame-samsung {
      border: 10px solid #0f172a;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8),
                  0 0 0 2px rgba(255, 255, 255, 0.15);
      border-radius: 28px;
    }

    /* Marco iPad Pro */
    .frame-ipad {
      border: 16px solid #1e293b;
      box-shadow: 0 35px 90px -15px rgba(0, 0, 0, 0.85), 
                  0 0 0 2px rgba(255, 255, 255, 0.1);
      border-radius: 40px;
    }

    /* Marco MacBook */
    .frame-macbook {
      border: 14px solid #0f172a;
      border-bottom: 24px solid #1e293b;
      box-shadow: 0 45px 100px -20px rgba(0, 0, 0, 0.9),
                  0 0 0 2px rgba(255, 255, 255, 0.1);
      border-radius: 20px 20px 8px 8px;
      position: relative;
    }
    .frame-macbook::after {
      content: '';
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      width: 108%;
      height: 12px;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      border-radius: 0 0 16px 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    /* Ocultar scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Forzar supresión de scrollbar en iframes */
    iframe {
      scrollbar-width: none;
    }
    iframe::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950">

  <!-- BARRA DE HERRAMIENTAS SUPERIOR -->
  <header class="h-16 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 flex items-center justify-between shrink-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i data-lucide="smartphone" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white flex items-center gap-2">
          Visor Multi-Dispositivo
          <span class="text-[10px] uppercase font-black px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">/visor</span>
        </h1>
        <p class="text-[11px] text-slate-400">Simulador oficial de pantalla y hardware para Aizprua S.E.</p>
      </div>
    </div>

    <!-- SELECTOR DE DISPOSITIVOS -->
    <div class="flex items-center bg-slate-950/80 p-1 rounded-2xl border border-slate-800 shadow-inner gap-1">
      <button onclick="setDevice('iphone')" id="btn-iphone" class="device-tab px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm" title="iPhone 16 Pro Max (iOS)">
        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
        <span>iPhone</span>
      </button>

      <button onclick="setDevice('samsung')" id="btn-samsung" class="device-tab px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50" title="Samsung Galaxy S24 Ultra (Android)">
        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
        <span>Android</span>
      </button>

      <button onclick="setDevice('ipad')" id="btn-ipad" class="device-tab px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50" title="iPad Pro 12.9 (Tablet)">
        <i data-lucide="tablet" class="w-3.5 h-3.5"></i>
        <span>iPad</span>
      </button>

      <button onclick="setDevice('macbook')" id="btn-macbook" class="device-tab px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50" title="MacBook Pro (Laptop)">
        <i data-lucide="laptop" class="w-3.5 h-3.5"></i>
        <span>MacBook</span>
      </button>
    </div>

    <!-- SELECTOR DE PÁGINAS Y CONTROLES -->
    <div class="flex items-center gap-2">
      <!-- Selector de Página -->
      <div class="relative">
        <select id="page-select" onchange="loadPage(this.value)" class="bg-slate-950 border border-slate-700/80 rounded-xl px-3 py-2 text-xs font-bold text-white pr-8 focus:outline-none focus:border-indigo-500 cursor-pointer max-w-[260px] truncate shadow-sm">
          <!-- Opciones dinámicas inyectadas por JS -->
        </select>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      </div>

      <!-- Modo Barra de Navegador (Safari / Chrome) -->
      <button onclick="toggleBrowserBar()" id="btn-browser-bar" class="px-2.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold transition shadow-sm flex items-center gap-1.5" title="Alternar entre navegador Safari/Chrome y pantalla completa">
        <i data-lucide="compass" class="w-3.5 h-3.5"></i>
        <span class="hidden md:inline">Navegador</span>
      </button>

      <!-- Botón de Rotación (Portrait / Landscape) -->
      <button onclick="toggleOrientation()" id="btn-orientation" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center transition shadow-sm" title="Girar pantalla (Vertical / Horizontal)">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>

      <!-- Selector de Zoom -->
      <div class="flex items-center bg-slate-950 rounded-xl border border-slate-800 p-0.5">
        <button onclick="setZoom(0.65)" class="zoom-btn px-2 py-1 text-[11px] font-bold text-slate-400 hover:text-white rounded-lg">65%</button>
        <button onclick="setZoom(0.85)" class="zoom-btn px-2 py-1 text-[11px] font-bold text-slate-400 hover:text-white rounded-lg">85%</button>
        <button onclick="setZoom(1)" class="zoom-btn px-2 py-1 text-[11px] font-bold bg-slate-800 text-white rounded-lg">100%</button>
      </div>

      <!-- Recargar iframe -->
      <button onclick="reloadPreview()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center transition shadow-sm" title="Recargar página">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>

      <!-- Abrir en pestaña nueva -->
      <a id="external-link" href="/" target="_blank" rel="noopener noreferrer" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center transition shadow-sm" title="Abrir en pestaña completa">
        <i data-lucide="external-link" class="w-4 h-4"></i>
      </a>
    </div>
  </header>

  <!-- ÁREA DE SIMULACIÓN Y ESCENARIO -->
  <main class="flex-1 overflow-auto flex items-center justify-center p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950 relative">

    <!-- Cuadrícula sutil de fondo -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:32px_32px] pointer-events-none"></div>

    <!-- CONTENEDOR ESCALABLE DEL DISPOSITIVO -->
    <div id="device-wrapper" class="transition-all duration-300 ease-out origin-center relative flex items-center justify-center">

      <!-- MARCO DEL DISPOSITIVO (FLEX COLUMNA CON CHROME NATIVO) -->
      <div id="device-frame" class="frame-iphone bg-slate-950 relative overflow-hidden transition-all duration-300 flex flex-col">

        <!-- 1. BARRA SUPERIOR DE HARDWARE (STATUS BAR) -->
        <div id="device-top-chrome" class="bg-slate-950 text-white relative shrink-0 z-30 select-none">
          
          <!-- STATUS BAR: CLOCK, SENSORS, BATTERY -->
          <div id="status-bar-row" class="h-10 px-6 flex items-center justify-between text-[11px] font-bold text-white relative">
            <span id="device-time" class="tracking-tight">09:41</span>

            <!-- DYNAMIC ISLAND (iOS) -->
            <div id="dynamic-island" class="absolute top-2 left-1/2 -translate-x-1/2 w-28 h-6 bg-black rounded-full z-40 flex items-center justify-between px-2.5 shadow-md border border-slate-800/80 pointer-events-none">
              <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center">
                <div class="w-1 h-1 rounded-full bg-indigo-950"></div>
              </div>
              <div class="w-2 h-2 rounded-full bg-slate-900 border border-slate-800"></div>
            </div>

            <!-- PUNCH-HOLE CAMERA (Android) -->
            <div id="punch-hole" class="hidden absolute top-2.5 left-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-black rounded-full z-40 border border-slate-800 flex items-center justify-center shadow-md pointer-events-none">
              <div class="w-1.5 h-1.5 rounded-full bg-slate-900"></div>
            </div>

            <!-- NOTCH (MacBook) -->
            <div id="macbook-notch" class="hidden absolute top-0 left-1/2 -translate-x-1/2 w-32 h-3.5 bg-slate-950 rounded-b-xl z-40 flex items-center justify-center pointer-events-none">
              <div class="w-1.5 h-1.5 rounded-full bg-slate-900 border border-slate-800"></div>
            </div>

            <!-- HARDWARE ICONS -->
            <div class="flex items-center gap-1.5">
              <i data-lucide="signal" class="w-3 h-3"></i>
              <i data-lucide="wifi" class="w-3 h-3"></i>
              <i data-lucide="battery" class="w-3.5 h-3.5"></i>
            </div>
          </div>

          <!-- MINI BARRA DE NAVEGADOR (SAFARI / CHROME URL BAR) -->
          <div id="browser-url-bar" class="px-4 pb-2 pt-0.5 flex items-center gap-2">
            <div class="flex-1 bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 flex items-center justify-center gap-1.5 text-[11px] text-slate-300 shadow-inner">
              <i data-lucide="lock" class="w-3 h-3 text-emerald-400"></i>
              <span id="browser-url-display" class="font-medium truncate">aizprua.com/principal.html</span>
            </div>
            <button onclick="reloadPreview()" class="text-slate-400 hover:text-white p-1" title="Refrescar">
              <i data-lucide="rotate-cw" class="w-3 h-3"></i>
            </button>
          </div>
        </div>

        <!-- 2. PANTALLA INTERNA (IFRAME LIMPIO Y 100% INTERACTIVO) -->
        <div id="screen-viewport" class="flex-1 w-full relative overflow-hidden bg-white">
          <iframe id="preview-iframe" src="/principal.html" class="w-full h-full border-none bg-white relative z-10" loading="eager"></iframe>
        </div>

        <!-- 3. BARRA INFERIOR DE HARDWARE (HOME INDICATOR) -->
        <div id="device-bottom-chrome" class="bg-slate-950 py-1.5 flex items-center justify-center shrink-0 z-30 select-none">
          <div id="home-indicator" class="w-32 h-1 bg-slate-400/80 rounded-full transition-opacity"></div>
        </div>

      </div>

    </div>

  </main>

  <!-- PIE DE DETALLES DEL DISPOSITIVO -->
  <footer class="h-10 bg-slate-900 border-t border-slate-800/80 px-6 flex items-center justify-between text-xs text-slate-400 shrink-0 z-40">
    <div class="flex items-center gap-4">
      <span class="flex items-center gap-1.5 text-slate-300">
        <i data-lucide="monitor" class="w-3.5 h-3.5 text-indigo-400"></i>
        <strong id="device-name-display">Apple iPhone 16 Pro Max</strong>
      </span>
      <span class="text-slate-600">|</span>
      <span id="resolution-display" class="font-mono text-[11px] text-slate-400">430 × 932 px (3x Retina)</span>
    </div>

    <div class="flex items-center gap-4 text-[11px]">
      <span class="flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Interactividad 100% activa</span>
      </span>
      <span class="text-slate-600">|</span>
      <span class="text-slate-400">Escala: <strong id="zoom-label" class="text-white">100%</strong></span>
    </div>
  </footer>

  <script>
    // Configuración oficial de hardware
    const DEVICES = {
      iphone: {
        name: 'Apple iPhone 16 Pro Max',
        width: 430,
        height: 932,
        frameClass: 'frame-iphone',
        hasDynamicIsland: true,
        hasPunchHole: false,
        hasMacbookNotch: false,
        hasHomeIndicator: true,
        hasStatusBar: true,
        resolution: '430 × 932 px (3x Super Retina)'
      },
      samsung: {
        name: 'Samsung Galaxy S24 Ultra',
        width: 412,
        height: 915,
        frameClass: 'frame-samsung',
        hasDynamicIsland: false,
        hasPunchHole: true,
        hasMacbookNotch: false,
        hasHomeIndicator: true,
        hasStatusBar: true,
        resolution: '412 × 915 px (QHD+ Dynamic AMOLED)'
      },
      ipad: {
        name: 'Apple iPad Pro 12.9"',
        width: 834,
        height: 1112,
        frameClass: 'frame-ipad',
        hasDynamicIsland: false,
        hasPunchHole: false,
        hasMacbookNotch: false,
        hasHomeIndicator: true,
        hasStatusBar: true,
        resolution: '834 × 1112 px (Liquid Retina XDR)'
      },
      macbook: {
        name: 'MacBook Pro 16"',
        width: 1080,
        height: 700,
        frameClass: 'frame-macbook',
        hasDynamicIsland: false,
        hasPunchHole: false,
        hasMacbookNotch: true,
        hasHomeIndicator: false,
        hasStatusBar: true,
        resolution: '1440 × 900 px (Retina Display)'
      }
    };

    let currentDevice = 'iphone';
    let isLandscape = false;
    let currentZoom = 1;
    let showBrowserBar = true;

    // Páginas detectadas dinámicamente o por defecto
    const DEFAULT_PAGES = [
      { name: 'Portada Principal (Home)', url: '/principal.html' },
      { name: 'Tienda & Catálogo', url: '/tienda.html' },
      { name: 'Plan 360 Digital', url: '/plan-360-digital.html' },
      { name: 'Plan 360 Kit Físico', url: '/plan-360.html' },
      { name: 'Hoja de Ruta Interactiva', url: '/hoja-de-ruta.html' },
      { name: 'Formulario de Diagnóstico', url: '/formulario-diagnostico.html' },
      { name: 'Informe de Diagnóstico', url: '/informe-diagnostico.html' },
      { name: 'Verificador Empresarial', url: '/verificador.html' },
      { name: 'Blog Principal', url: '/blog.html' },
      { name: 'Artículo: Multas en Panamá', url: '/articulo-multas-panama.html' },
      { name: 'Artículo: Crédito Bancario', url: '/articulo-credito-bancario.html' },
      { name: 'Artículo: Contratos Comerciales', url: '/articulo-contratos-comerciales.html' },
      { name: 'Artículo: Emprender en Panamá', url: '/articulo-emprender.html' },
      { name: 'Artículo: Mentalidad Empresarial', url: '/articulo-mentalidad.html' },
      { name: 'Agendar Consulta', url: '/agendar.html' },
      { name: 'Test Interactivo', url: '/test-interactivo.html' },
      { name: 'Simulador de Préstamos', url: '/simulador-prestamos.html' },
      { name: 'Calculadora de Precios', url: '/calculadora-precios.html' },
      { name: 'Recursos Gratuitos', url: '/recursos-gratuitos.html' },
      { name: 'Links Oficiales', url: '/links.html' }
    ];

    function initPageSelector() {
      const select = document.getElementById('page-select');
      select.innerHTML = '';
      
      const pages = window.PROJECT_PAGES || DEFAULT_PAGES;

      pages.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.url;
        opt.textContent = p.name;
        select.appendChild(opt);
      });

      // Cargar primera página
      loadPage(pages[0].url);
    }

    function loadPage(url) {
      const iframe = document.getElementById('preview-iframe');
      iframe.src = url;
      document.getElementById('external-link').href = url;
      
      const displayUrl = 'aizprua.com' + (url.startsWith('/') ? url : '/' + url);
      document.getElementById('browser-url-display').innerText = displayUrl;
    }

    function reloadPreview() {
      const iframe = document.getElementById('preview-iframe');
      iframe.src = iframe.src;
    }

    function toggleBrowserBar() {
      showBrowserBar = !showBrowserBar;
      const bar = document.getElementById('browser-url-bar');
      const btn = document.getElementById('btn-browser-bar');
      
      bar.classList.toggle('hidden', !showBrowserBar);
      btn.classList.toggle('bg-indigo-600', showBrowserBar);
      btn.classList.toggle('text-white', showBrowserBar);
      btn.classList.toggle('bg-slate-800', !showBrowserBar);
      btn.classList.toggle('text-slate-400', !showBrowserBar);
    }

    function setDevice(deviceKey) {
      currentDevice = deviceKey;
      const dev = DEVICES[deviceKey];

      // Actualizar pestañas superiores
      document.querySelectorAll('.device-tab').forEach(b => {
        b.className = 'device-tab px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50';
      });
      document.getElementById('btn-' + deviceKey).className = 'device-tab px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 bg-indigo-600 text-white shadow-sm';

      applyDimensions();

      // Actualizar marcas de hardware
      const frame = document.getElementById('device-frame');
      frame.className = dev.frameClass + ' bg-slate-950 relative overflow-hidden transition-all duration-300 flex flex-col';

      document.getElementById('dynamic-island').classList.toggle('hidden', !dev.hasDynamicIsland || isLandscape);
      document.getElementById('punch-hole').classList.toggle('hidden', !dev.hasPunchHole || isLandscape);
      document.getElementById('macbook-notch').classList.toggle('hidden', !dev.hasMacbookNotch);
      document.getElementById('home-indicator').classList.toggle('hidden', !dev.hasHomeIndicator);
      document.getElementById('status-bar-row').classList.toggle('hidden', isLandscape);

      document.getElementById('device-name-display').innerText = dev.name;
      document.getElementById('resolution-display').innerText = dev.resolution;
    }

    function applyDimensions() {
      const dev = DEVICES[currentDevice];
      const frame = document.getElementById('device-frame');
      
      const w = isLandscape ? dev.height : dev.width;
      const h = isLandscape ? dev.width : dev.height;

      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
    }

    function toggleOrientation() {
      isLandscape = !isLandscape;
      const btn = document.getElementById('btn-orientation');
      btn.classList.toggle('bg-indigo-600', isLandscape);
      btn.classList.toggle('text-white', isLandscape);

      setDevice(currentDevice);
    }

    function setZoom(val) {
      currentZoom = val;
      const wrapper = document.getElementById('device-wrapper');
      wrapper.style.transform = `scale(${val})`;
      document.getElementById('zoom-label').innerText = Math.round(val * 100) + '%';

      document.querySelectorAll('.zoom-btn').forEach(b => {
        b.classList.remove('bg-slate-800', 'text-white');
        b.classList.add('text-slate-400');
        if (b.innerText === Math.round(val * 100) + '%') {
          b.classList.add('bg-slate-800', 'text-white');
          b.classList.remove('text-slate-400');
        }
      });
    }

    // Inyectar supresión de scrollbar dentro del iframe en cada carga
    const iframe = document.getElementById('preview-iframe');
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const style = doc.createElement('style');
        style.textContent = `
          ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
          html, body { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        `;
        doc.head.appendChild(style);
      } catch (e) {
        // En caso de restricción cross-origin, el backend ya lo inyecta
      }
    });

    // Actualizar reloj dinámico del teléfono
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const el = document.getElementById('device-time');
      if (el) el.innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    window.addEventListener('DOMContentLoaded', () => {
      initPageSelector();
      setDevice('iphone');
      lucide.createIcons();
    });
  </script>
</body>
</html>
